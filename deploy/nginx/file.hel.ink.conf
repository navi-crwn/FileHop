# nginx vhost for FileHop (file.hel.ink), same shape as note.hel.ink: Cloudflare in
# front with the *.hel.ink origin certificate, the Go binary on 127.0.0.1:8095.
#
# The Go server sends COOP/COEP/CORP and the CSP itself (internal/app/app.go), so
# they are the same behind nginx, behind `npm run local`, and in the tests. nginx
# only adds what belongs to the edge. Do not add another Content-Security-Policy
# here: two CSP headers are both enforced, and the stricter one wins silently.
#
# Install: /etc/nginx/sites-available/file.hel.ink, symlink into sites-enabled,
# `nginx -t && systemctl reload nginx` (deploy/install.sh does this).

server {
    listen 80;
    listen [::]:80;
    server_name file.hel.ink;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name file.hel.ink;

    ssl_certificate     /etc/ssl/certs/hel.ink-origin.crt;
    ssl_certificate_key /etc/ssl/private/hel.ink-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/file.hel.ink.access.log;
    error_log  /var/log/nginx/file.hel.ink.error.log;

    # Files are converted in the browser and nothing is uploaded, so request bodies are small: the hub's
    # signed events (1 MB cap in the server). The one exception is "Save to PixelHop", which has its own
    # location below with a larger limit.
    client_max_body_size 1m;

    # The worker chunk is ~610 KB raw, ~236 KB gzip. Cloudflare compresses to the
    # visitor; this compresses the Cloudflare-to-origin hop as well.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # /send signalling is a WebSocket: two browsers are introduced to each other here, then talk
    # directly (no file ever passes through this server). Cloudflare closes a WebSocket that is
    # silent for 100 s; the app pings every 30 s, so 90 s here is enough.
    # The per-visitor limits of /send (rooms per hour, wrong codes per minute, sockets per minute)
    # key on the address in X-Forwarded-For, which is $remote_addr here. Behind Cloudflare that is
    # the visitor only if nginx restores it: `set_real_ip_from <Cloudflare ranges>;` and
    # `real_ip_header CF-Connecting-IP;` (on the production server these sit in a global conf.d
    # file). Without them every visitor shares one Cloudflare address and one limit.
    location = /api/send/signal {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 90s;
    }

    # "Save to PixelHop": one finished file (at most FILEHOP_PIXELHOP_MAX_MB, 20 by default) goes through
    # here to PixelHop. The body limit is just above that cap; if you raise FILEHOP_PIXELHOP_MAX_MB, raise
    # this too, or nginx answers 413 first. Request buffering stays on (nginx reads the whole upload before
    # the app sees it, so a slow client does not hold an app slot); the timeouts fit a 20 MB upload.
    location = /api/v1/pixelhop/save {
        client_max_body_size 21m;
        client_body_timeout 60s;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Real-IP "";
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 60s;
    }
}
